# NullGate 3.0 — local test stack (single service, mirrors the Railway deploy)
#
#   api (Go + Xray + embedded panel UI :8080, Reality :9000)
#        └──→  postgres :5432   redis :6379
#
# Run:    docker compose up --build
# Panel:  http://localhost:8080   (first open → setup page → create admin)
# Reality link address: 127.0.0.1:9000  (stands in for the Railway TCP Proxy)
#
# Zero manual variables in production too — see RAILWAY_GUIDE.md:
# on Railway, DATABASE_URL/PG* arrive via the UI "Connect" button and
# RAILWAY_TCP_PROXY_* / RAILWAY_TCP_APPLICATION_PORT are auto-injected.

name: nullgate

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nullgate
      POSTGRES_PASSWORD: nullgate
      POSTGRES_DB: nullgate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullgate -d nullgate"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://nullgate:nullgate@postgres:5432/nullgate?sslmode=disable
      REDIS_URL: redis://redis:6379
      COOKIE_INSECURE: "1"          # panel is served over plain http here
      # local stand-in for the Railway TCP Proxy (host:port shown in links)
      TCP_HOST: 127.0.0.1
      TCP_PORT: "9000"
      TCP_APP_PORT: "9000"          # Reality inbound port inside the container
    ports:
      - "8080:8080"                 # panel + API (UI is embedded in the binary)
      - "9000:9000"                 # Reality inbound — your local "TCP Proxy"

volumes:
  pgdata:
