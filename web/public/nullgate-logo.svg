<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ngGold" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9e29a"/>
      <stop offset=".45" stop-color="#e8bc4f"/>
      <stop offset="1" stop-color="#a9761f"/>
    </linearGradient>
    <radialGradient id="ngGlow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#ffd970" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffd970" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow -->
  <circle cx="32" cy="30" r="27" fill="url(#ngGlow)"/>

  <!-- outer gate arch -->
  <path d="M13.5 52.5 V27 a18.5 18.5 0 0 1 37 0 V52.5"
        stroke="url(#ngGold)" stroke-width="4.6" stroke-linecap="round"/>
  <!-- ground line -->
  <path d="M8.5 52.5 h47" stroke="url(#ngGold)" stroke-width="4.6" stroke-linecap="round"/>

  <!-- inner portal (open gate = null gate) -->
  <path d="M22.5 52.5 V31 a9.5 9.5 0 0 1 19 0 V52.5"
        stroke="url(#ngGold)" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>

  <!-- null slash -->
  <path d="M27.5 43.5 L36.5 25.5" stroke="url(#ngGold)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- bokeh -->
  <circle cx="50.5" cy="15.5" r="1.7" fill="#f4d276" opacity=".95"/>
  <circle cx="12.5" cy="19.5" r="1.2" fill="#f4d276" opacity=".7"/>
  <circle cx="44" cy="8.5" r="1" fill="#f4d276" opacity=".55"/>
  <circle cx="19" cy="9.5" r=".9" fill="#f4d276" opacity=".45"/>
</svg>
